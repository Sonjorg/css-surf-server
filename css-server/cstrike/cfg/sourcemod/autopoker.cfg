// autopoker.net - surf | SourceMod map voting (RTV + nominations + end-of-map vote)

// --- End-of-map vote (when mp_timelimit runs out) ---
sm_mapvote_endvote 1
sm_mapvote_voteduration 25
sm_mapvote_include 5
sm_mapvote_exclude 3
sm_mapvote_extend 1
sm_extendmap_timestep 15
sm_mapvote_novote 1

// --- Rock The Vote (!rtv in chat) ---
sm_rtv_needed 0.50
sm_rtv_minplayers 1
sm_rtv_initialdelay 90
sm_rtv_interval 180
sm_rtv_changetime 2

// --- General vote spacing ---
sm_vote_delay 20
