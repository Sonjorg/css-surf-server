// autopoker.net - surf | Counter-Strike: Source combat surf server
hostname "autopoker.net - surf"
sv_tags "surf,combat,bhop,autopoker"
motdfile "motd.txt"

// Change before going public
rcon_password "Anytime11Front1Growing"

sv_lan 0
sv_region 3

// --- Map timing (end-of-map vote uses mp_timelimit) ---
mp_timelimit 25
mp_maxrounds 0
mp_roundtime 60
mp_freezetime 2
mp_buytime 0.25
mp_c4timer 35

// --- Teams / gameplay ---
mp_autoteambalance 1
mp_limitteams 2
mp_friendlyfire 0
mp_flashlight 1
mp_footsteps 1
mp_forcecamera 0
mp_allowspectators 1
sv_alltalk 1
sv_voiceenable 1

// --- Surf / bhop physics (combat surf feel — light, not vanilla-heavy) ---
sv_airaccelerate 200
sv_accelerate 10
sv_friction 4
sv_gravity 800
sv_maxvelocity 3500
sv_maxspeed 320
sv_enablebunnyhopping 1

// --- 66 tick rates (classic combat surf) ---
sv_minrate 20000
sv_maxrate 30000
sv_minupdaterate 66
sv_maxupdaterate 66
sv_mincmdrate 66
sv_maxcmdrate 66

// --- Map list used by SourceMod nominations / mapchooser ---
mapcyclefile "mapcycle.txt"

// --- Keep one idle bot so the server stays awake in the browser ---
bot_quota 1
bot_quota_mode fill
bot_difficulty 0
bot_chatter off
bot_join_after_player 0
bot_auto_vacate 0

// --- SourceMod map vote settings ---
exec sourcemod/autopoker.cfg

log on
sv_logbans 1
sv_logecho 1
sv_logfile 1
